name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - run: cargo fmt --check
        working-directory: core
      - run: cargo clippy -- -D warnings
        working-directory: core
      - run: cargo test
        working-directory: core

  core-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.4
          cache-dependency-path: tests/e2e/mock-upstream/go.mod
      - run: bash tests/e2e/smoke-core.sh

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tokenne
          POSTGRES_PASSWORD: tokenne
          POSTGRES_DB: tokenne
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://tokenne:tokenne@localhost:5432/tokenne?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.4
          cache-dependency-path: server/go.mod
      - run: go vet ./...
        working-directory: server
      - run: go test ./...
        working-directory: server
      - run: go build ./...
        working-directory: server

  e2e-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.4
          cache-dependency-path: tests/e2e/mock-upstream/go.mod
      - run: test -z "$(gofmt -l .)"
        working-directory: tests/e2e/mock-upstream
      - run: go vet ./...
        working-directory: tests/e2e/mock-upstream
      - run: go test ./...
        working-directory: tests/e2e/mock-upstream
      - run: go build ./...
        working-directory: tests/e2e/mock-upstream

  closure:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tokenne
          POSTGRES_PASSWORD: tokenne
          POSTGRES_DB: tokenne
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://tokenne:tokenne@localhost:5432/tokenne?sslmode=disable
      # The job owns this service container: its server address is a private
      # Docker network IP, so the script's remote-reset guard needs an explicit
      # acknowledgement that this database is disposable.
      CLOSURE_ALLOW_REMOTE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.4
          cache-dependency-path: server/go.mod
      - run: sudo apt-get update && sudo apt-get install -y jq
      - run: bash tests/e2e/closure.sh

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run typecheck
        working-directory: web
      - run: bun run lint
        working-directory: web
      - run: bun run test
        working-directory: web
      - run: bun run build
        working-directory: web

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bunx --bun @redocly/cli@latest lint openapi.yaml
      - run: python3 -m pip install --user pyyaml
      - run: python3 -c 'import yaml; yaml.safe_load(open("ops/compose.yaml")); yaml.safe_load(open("ops/prometheus/prometheus.yml")); yaml.safe_load(open("config/status-rewrite.yaml")); yaml.safe_load(open("tests/e2e/compose.override.yaml")); yaml.safe_load(open(".github/workflows/release.yml"))'

  release-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s ops/release -p 'test_*.py'
