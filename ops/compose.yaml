services:
  postgres:
    image: postgres:19.0-alpine
    environment:
      POSTGRES_DB: token_ne
      POSTGRES_USER: token_ne
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the deployment environment}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U token_ne -d token_ne"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - data

  socket-proxy:
    image: tecnativa/docker-socket-proxy:3.4
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      POST: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - "2375"
    networks:
      - data

  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    depends_on:
      socket-proxy:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://token_ne:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the deployment environment}@postgres:5432/token_ne?sslmode=disable
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in the deployment environment}
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      CADDY_ADMIN_URL: unix:///run/caddy/admin.sock
      CADDY_TLS_MODE: ${CADDY_TLS_MODE:-off}
      CADDY_HTTP_PORT: ${CADDY_HTTP_PORT:-8080}
      DOCKER_HOST: tcp://socket-proxy:2375
      CORE_NETWORKS: token_ne_edge,token_ne_core_control
      CORE_CONTROL_TOKEN: ${CORE_CONTROL_TOKEN:?set CORE_CONTROL_TOKEN in the deployment environment}
      CORE_CONFIG_SIGNING_KEY: ${CORE_CONFIG_SIGNING_KEY:-}
      CORE_CONFIG_SIGNATURE_MODE: ${CORE_CONFIG_SIGNATURE_MODE:-warn}
      CORE_CACHE_KEY: ${CORE_CACHE_KEY:?set CORE_CACHE_KEY in the deployment environment}
      CORE_ALLOW_PRIVATE_UPSTREAMS: ${CORE_ALLOW_PRIVATE_UPSTREAMS:-false}
      CORE_STATE_HOST_DIR: ${CORE_STATE_HOST_DIR:?set an absolute CORE_STATE_HOST_DIR}
      CORE_STATE_INIT_IMAGE: ${CORE_STATE_INIT_IMAGE:-busybox:1.37}
      CORE_IMAGE_REPOSITORY: ${CORE_IMAGE_REPOSITORY:-ghcr.io/ivanli-cn/token-ne-core}
      ALLOW_PRIVATE_UPSTREAMS: ${CORE_ALLOW_PRIVATE_UPSTREAMS:-false}
      STREAM_USAGE_INJECTION: ${STREAM_USAGE_INJECTION:-true}
      SECOND_PHASE_MODEL_MANAGEMENT: ${SECOND_PHASE_MODEL_MANAGEMENT:-false}
      CONTROL_PLANE_URL: ${CONTROL_PLANE_URL:-http://api:8080}
      CORE_SPOOL_DIR: ${CORE_SPOOL_DIR:-}
      STATUS_REWRITE_CONFIG: /etc/token-ne/status-rewrite.yaml
      MASTER_KEY: ${MASTER_KEY:?set MASTER_KEY in the deployment environment}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?set ADMIN_USERNAME in the deployment environment}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in the deployment environment}
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
      OIDC_CA_FILE: ${OIDC_CA_FILE:-}
      AUTH_LOCAL_LOGIN_ENABLED: ${AUTH_LOCAL_LOGIN_ENABLED:-true}
      AUTH_SESSION_TTL_HOURS: ${AUTH_SESSION_TTL_HOURS:-720}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in the deployment environment}
      METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN in the deployment environment}
    expose:
      - "8080"
      - "9090"
    ports:
      - "127.0.0.1:${METRICS_PORT:-9090}:9090"
    volumes:
      - ../config:/etc/token-ne:ro
      - caddy_admin:/run/caddy
    healthcheck:
      test: ["CMD", "/app/api", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - edge
      - core-control
      - data

  caddy-init:
    image: busybox:1.37
    user: "0:0"
    network_mode: none
    restart: "no"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - caddy_admin:/run/caddy
    command: ["sh", "-c", "chown -R 65532:65532 /data /config /run/caddy"]

  caddy:
    image: caddy:2.11.9-alpine
    user: "65532:65532"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      api:
        condition: service_healthy
      caddy-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${CADDY_HTTP_PORT:-8080}:80"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - caddy_admin:/run/caddy
      - ./caddy/bootstrap.json:/etc/caddy/bootstrap.json:ro
    command:
      - sh
      - -c
      - |
        if [ -f /config/caddy/autosave.json ]; then
          exec caddy run --resume
        else
          exec caddy run --config /etc/caddy/bootstrap.json
        fi
    networks:
      - edge

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  caddy_admin:

networks:
  edge:
    name: token_ne_edge
  core-control:
    name: token_ne_core_control
  data:
    name: token_ne_data
