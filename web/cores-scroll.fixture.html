<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><div id="root"></div><script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
import { createMemoryRouter, RouterProvider } from 'react-router';
import { AppProviders } from './src/app/providers';
import { routes } from './src/app/router';
import { createQueryClient } from './src/lib/query-client';
import './src/index.css';
const path = new URLSearchParams(location.search).get('start') ?? '/system/cores';
window.fetch = async input => {
  switch (String(input)) {
    case '/api/auth/me': return Response.json({ id: 'fixture-admin', username: 'operator' });
    case '/api/cores':
      await new Promise(resolve => setTimeout(resolve, 150));
      return Response.json({ versions: [], instances: [], deployments: [] });
    case '/api/data-plane-settings': return Response.json({ stream_usage_injection: true });
    case '/api/cores/spool': return Response.json({ data: [] });
    default: return Response.json({}, { status: 404 });
  }
};
const router = createMemoryRouter(routes, { initialEntries: [path] });
window.fixtureRouter = router;
createRoot(document.getElementById('root')).render(React.createElement(AppProviders, { client: createQueryClient() }, React.createElement(RouterProvider, { router })));
</script></html>
