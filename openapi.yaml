openapi: 3.1.0
info:
  title: token-ne API
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
  description: |
    token-ne 的对外 OpenAI 兼容接口与管理 API 契约。
    下游 `/v1/*` 只承诺第一期定义的 OpenAI 风格端点；管理 API 使用会话 Cookie、
    同源校验和统一错误信封。内部核心控制协议见 `docs/protocol.md`.
    上游模型目录与承接策略、模型名称路由、上游价格覆盖、报价同步和出站代理档案属于第二期接口设计。
    共用接口兼容第一期载荷。新增字段的说明列出第二期启用后的约束。
servers:
  - url: http://127.0.0.1:8080
    description: 本地或外部 TLS 代理后的入口

tags:
  - name: system
    description: 控制面运行时版本
  - name: auth
    description: 管理员本地/OIDC 登录、退出、会话和身份绑定
  - name: settings
    description: 管理员认证与系统设置
  - name: models
    description: 全局模型、名称路由、计费和全局映射
  - name: upstreams
    description: 上游、模型能力和测试
  - name: prices
    description: 全局/上游价格、受控价格源和报价应用
  - name: egress
    description: 出站代理档案、Xray 运行态和代理连通性测试
  - name: downstream-keys
    description: 下游 API Key 生命周期
  - name: cores
    description: 核心版本、实例、部署、排水和 spool 摘要
  - name: usage
    description: 总览、时间序列、分布和请求事实
  - name: audit
    description: 管理操作审计
  - name: downstream
    description: OpenAI 兼容下游接口

paths:
  /api/auth/login:
    post:
      tags: [auth]
      summary: 管理员登录
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/AdminBadRequest"
        "413":
          $ref: "#/components/responses/AdminPayloadTooLarge"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "500":
          $ref: "#/components/responses/AdminInternal"
        "503":
          $ref: "#/components/responses/AdminStorageUnavailable"

  /api/auth/logout:
    post:
      tags: [auth]
      summary: 退出登录并使所有 token-ne 会话失效
      operationId: logout
      security:
        - cookieAuth: []
      responses:
        "204":
          description: 已退出
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "500":
          $ref: "#/components/responses/AdminInternal"
        "503":
          $ref: "#/components/responses/AdminStorageUnavailable"

  /api/auth/me:
    get:
      tags: [auth]
      summary: 当前管理员
      operationId: getCurrentAdmin
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 当前管理员
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "500":
          $ref: "#/components/responses/AdminInternal"
        "503":
          $ref: "#/components/responses/AdminStorageUnavailable"

  /api/auth/config:
    get:
      tags: [auth]
      summary: 公开的登录能力
      operationId: getAuthConfig
      security: []
      responses:
        "200":
          description: 本地与 OIDC 登录能力
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthConfig"
        "500":
          $ref: "#/components/responses/AdminInternal"
        "503":
          $ref: "#/components/responses/AdminStorageUnavailable"

  /api/auth/oidc/start:
    get:
      tags: [auth]
      summary: 发起 OIDC 登录
      operationId: startOIDCLogin
      security: []
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: 重定向到 OIDC authorization endpoint，或在不可用时重定向到登录页错误状态
          headers:
            Location:
              schema:
                type: string
                format: uri

  /api/auth/oidc/callback:
    get:
      tags: [auth]
      summary: OIDC 登录或绑定回调
      operationId: oidcCallback
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
        - name: error_description
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: 登录成功、绑定成功或通用登录失败重定向
          headers:
            Location:
              schema:
                type: string
                format: uri
        "400":
          $ref: "#/components/responses/AdminBadRequest"

  /api/auth/oidc/bind/start:
    post:
      tags: [auth]
      summary: 发起当前管理员的 OIDC 身份绑定
      operationId: startOIDCBind
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 绑定授权地址
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OIDCBindStart"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "409":
          $ref: "#/components/responses/AdminConflict"
        "500":
          $ref: "#/components/responses/AdminInternal"
        "503":
          $ref: "#/components/responses/AdminStorageUnavailable"

  /api/settings/auth:
    get:
      tags: [settings]
      summary: 读取管理员认证设置
      operationId: getAuthSettings
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 认证设置、来源和绑定状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSettings"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "500":
          $ref: "#/components/responses/AdminInternal"
        "503":
          $ref: "#/components/responses/AdminStorageUnavailable"
    put:
      tags: [settings]
      summary: 原子更新管理员认证设置
      operationId: updateAuthSettings
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthSettingsUpdate"
      responses:
        "200":
          description: 更新后的认证设置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSettings"
        "400":
          $ref: "#/components/responses/AdminBadRequest"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "409":
          $ref: "#/components/responses/AdminConflict"
        "413":
          $ref: "#/components/responses/AdminPayloadTooLarge"
        "422":
          $ref: "#/components/responses/AdminValidationFailed"
        "500":
          $ref: "#/components/responses/AdminInternal"
        "503":
          $ref: "#/components/responses/AdminStorageUnavailable"

  /api/settings/auth/test:
    post:
      tags: [settings]
      summary: 测试 OIDC discovery
      operationId: testAuthSettings
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthTestRequest"
      responses:
        "200":
          description: discovery 结果；失败时 ok=false
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTestResult"
        "400":
          $ref: "#/components/responses/AdminBadRequest"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "413":
          $ref: "#/components/responses/AdminPayloadTooLarge"
        "422":
          $ref: "#/components/responses/AdminValidationFailed"
        "500":
          $ref: "#/components/responses/AdminInternal"
        "503":
          $ref: "#/components/responses/AdminStorageUnavailable"

  /api/version:
    get:
      tags: [system]
      summary: 控制面运行时版本
      operationId: getRuntimeVersion
      security: []
      responses:
        "200":
          description: 当前 API 镜像的版本与构建信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeVersion"
        "400":
          $ref: "#/components/responses/AdminBadRequest"
        "500":
          $ref: "#/components/responses/AdminInternal"
        "503":
          $ref: "#/components/responses/AdminStorageUnavailable"

  /api/models:
    get:
      tags: [models]
      summary: 列出全局模型
      operationId: listModels
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 模型列表
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ModelAdmin"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "500":
          $ref: "#/components/responses/AdminInternal"
        "503":
          $ref: "#/components/responses/AdminStorageUnavailable"
    post:
      tags: [models]
      summary: 创建全局模型
      operationId: createModel
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelCreate"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelAdmin"
        "400":
          $ref: "#/components/responses/AdminBadRequest"
        "413":
          $ref: "#/components/responses/AdminPayloadTooLarge"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "500":
          $ref: "#/components/responses/AdminInternal"
        "503":
          $ref: "#/components/responses/AdminStorageUnavailable"
        "409":
          $ref: "#/components/responses/AdminConflict"
        "422":
          $ref: "#/components/responses/AdminValidationFailed"

  /api/models/{model_id}:
    parameters:
      - $ref: "#/components/parameters/ModelId"
    get:
      tags: [models]
      summary: 获取全局模型
      operationId: getModel
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 模型
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelAdmin"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "500":
          $ref: "#/components/responses/AdminInternal"
        "503":
          $ref: "#/components/responses/AdminStorageUnavailable"
        "404":
          $ref: "#/components/responses/AdminNotFound"
    put:
      tags: [models]
      summary: 更新全局模型
      operationId: updateModel
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelUpdate"
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelAdmin"
        "400":
          $ref: "#/components/responses/AdminBadRequest"
        "413":
          $ref: "#/components/responses/AdminPayloadTooLarge"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "500":
          $ref: "#/components/responses/AdminInternal"
        "503":
          $ref: "#/components/responses/AdminStorageUnavailable"
        "404":
          $ref: "#/components/responses/AdminNotFound"
        "422":
          $ref: "#/components/responses/AdminValidationFailed"
        "409":
          $ref: "#/components/responses/AdminConflict"
    delete:
      tags: [models]
      summary: 删除全局模型
      operationId: deleteModel
      security:
        - cookieAuth: []
      responses:
        "204":
          description: 已删除
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "500":
          $ref: "#/components/responses/AdminInternal"
        "503":
          $ref: "#/components/responses/AdminStorageUnavailable"
        "404":
          $ref: "#/components/responses/AdminNotFound"
        "409":
          $ref: "#/components/responses/AdminConflict"

  /api/upstreams:
    get:
      tags: [upstreams]
      summary: 列出上游
      operationId: listUpstreams
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 上游列表
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Upstream"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "500":
          $ref: "#/components/responses/AdminInternal"
        "503":
          $ref: "#/components/responses/AdminStorageUnavailable"
    post:
      tags: [upstreams]
      summary: 创建上游
      operationId: createUpstream
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpstreamCreateInput"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upstream"
        "400":
          $ref: "#/components/responses/AdminBadRequest"
        "413":
          $ref: "#/components/responses/AdminPayloadTooLarge"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "500":
          $ref: "#/components/responses/AdminInternal"
        "503":
          $ref: "#/components/responses/AdminStorageUnavailable"
        "422":
          $ref: "#/components/responses/AdminValidationFailed"

  /api/upstreams/{upstream_id}:
    parameters:
      - $ref: "#/components/parameters/UpstreamId"
    get:
      tags: [upstreams]
      summary: 获取上游及其模型能力
      operationId: getUpstream
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 上游
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upstream"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "500":
          $ref: "#/components/responses/AdminInternal"
        "503":
          $ref: "#/components/responses/AdminStorageUnavailable"
        "404":
          $ref: "#/components/responses/AdminNotFound"
    put:
      tags: [upstreams]
      summary: 更新上游并原子替换模型能力集合
      operationId: updateUpstream
      x-phase-two-request-schema:
        $ref: "#/components/schemas/UpstreamUpdateInputPhaseTwo"
      description: 适用两期的请求契约见 requestBody 的 UpstreamUpdateInput：一期从其一期分支读取，二期从 phase-two 严格分支读取。二期缺失 revision 返回 422、过期 revision 返回 409；服务按已启用阶段校验，禁止请求通过兼容分支绕过。
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpstreamUpdateInput"
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upstream"
        "400":
          $ref: "#/components/responses/AdminBadRequest"
        "413":
          $ref: "#/components/responses/AdminPayloadTooLarge"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "500":
          $ref: "#/components/responses/AdminInternal"
        "503":
          $ref: "#/components/responses/AdminStorageUnavailable"
        "404":
          $ref: "#/components/responses/AdminNotFound"
        "422":
          $ref: "#/components/responses/AdminValidationFailed"
        "409":
          $ref: "#/components/responses/AdminConflict"
    delete:
      tags: [upstreams]
      summary: 删除上游并级联删除模型能力
      operationId: deleteUpstream
      security:
        - cookieAuth: []
      responses:
        "204":
          description: 已删除
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "500":
          $ref: "#/components/responses/AdminInternal"
        "503":
          $ref: "#/components/responses/AdminStorageUnavailable"
        "404":
          $ref: "#/components/responses/AdminNotFound"
        "409":
          $ref: "#/components/responses/AdminConflict"

  /api/upstreams/{upstream_id}/test:
    parameters:
      - $ref: "#/components/parameters/UpstreamId"
    post:
      tags: [upstreams]
      summary: 测试上游
      operationId: testUpstream
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 测试结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpstreamTestResult"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "500":
          $ref: "#/components/responses/AdminInternal"
        "503":
          $ref: "#/components/responses/AdminStorageUnavailable"
        "404":
          $ref: "#/components/responses/AdminNotFound"

  /api/model-routes:
    get:
      tags: [models]
      summary: 列出模型名称路由规则
      operationId: listModelRoutes
      description: 按作用域键（`coalesce(upstream_id)`, 全局作用域用全零 UUID）升序、再按 `position` 升序返回全部规则。
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 路由规则
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ModelRoute"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "500":
          $ref: "#/components/responses/AdminInternal"
        "503":
          $ref: "#/components/responses/AdminStorageUnavailable"
    post:
      tags: [models]
      summary: 创建模型名称路由规则
      operationId: createModelRoute
      description: 新规则落在该作用域末尾，服务端在事务内把它设为该作用域当前最大 `position` 加一（无规则时为 0）；请求体不接受 `position`。
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelRouteInput"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelRoute"
        "400":
          $ref: "#/components/responses/AdminBadRequest"
        "413":
          $ref: "#/components/responses/AdminPayloadTooLarge"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "409":
          $ref: "#/components/responses/AdminConflict"
        "422":
          $ref: "#/components/responses/AdminValidationFailed"
        "500":
          $ref: "#/components/responses/AdminInternal"
        "503":
          $ref: "#/components/responses/AdminStorageUnavailable"
  /api/model-routes/preview:
    post:
      tags: [models]
      summary: 预览模型名称解析
      operationId: previewModelRoute
      description: "解析顺序与数据面一致：先按 `upstream_id` 升序逐个上游作用域，再全局作用域，都未命中最后按系统模型 ID 兜底。`resolved_model` 是命中的目标系统模型，`matched_rule`、`rule_kind` 只在由规则命中时返回；系统模型 ID 兜底时两者为 `null`。系统模型 ID 不短路路由。`candidates` 逐个启用上游计算：先查该上游作用域、未命中再查全局作用域、再未命中按系统模型 ID，目标模型须启用、绑定须启用且承接策略须允许。"
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requested_model]
              properties:
                requested_model:
                  type: string
                  minLength: 1
                  maxLength: 256
      responses:
        "200":
          description: 解析预览
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutePreview"
        "400":
          $ref: "#/components/responses/AdminBadRequest"
        "413":
          $ref: "#/components/responses/AdminPayloadTooLarge"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "422":
          $ref: "#/components/responses/AdminValidationFailed"
        "500":
          $ref: "#/components/responses/AdminInternal"
        "503":
          $ref: "#/components/responses/AdminStorageUnavailable"
  /api/model-routes/reorder:
    post:
      tags: [models]
      summary: 重排某个作用域内的路由规则
      operationId: reorderModelRoutes
      description: 在一次事务内把该作用域的 position 重写为 0..n-1，顺序即 route_ids 顺序；route_ids 必须精确覆盖该作用域的全部规则，否则整段回滚并返回 422。
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelRouteReorderInput"
      responses:
        "200":
          description: 该作用域重排后的完整规则列表
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
