  /v1/models:
    get:
      tags: [downstream]
      summary: 列出可用模型
      operationId: listOpenAIModels
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OpenAI ListModelsResponse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAIModelList"
        "401":
          $ref: "#/components/responses/OpenAIUnauthorized"
        "403":
          $ref: "#/components/responses/OpenAIPermissionDenied"

  /v1/models/{model}:
    parameters:
      - name: model
        in: path
        required: true
        schema:
          type: string
    get:
        tags: [downstream]
        summary: 查询单个模型
        operationId: retrieveOpenAIModel
        security:
          - bearerAuth: []
        responses:
          "200":
            description: OpenAI Model
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/OpenAIModel"
          "401":
            $ref: "#/components/responses/OpenAIUnauthorized"
          "404":
            $ref: "#/components/responses/OpenAINotFound"

  /v1/chat/completions:
    post:
      tags: [downstream]
      summary: Chat Completions 代理
      operationId: createChatCompletion
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
      responses:
        "200":
          description: OpenAI JSON 或 SSE 响应；核心只改写 model，其他字段透传
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestId"
            x-token-ne-attempts:
              $ref: "#/components/headers/Attempts"
            x-token-ne-upstream:
              $ref: "#/components/headers/UpstreamName"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletionResponse"
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/OpenAIBadRequest"
        "401":
          $ref: "#/components/responses/OpenAIUnauthorized"
        "403":
          $ref: "#/components/responses/OpenAIPermissionDenied"
        "404":
          $ref: "#/components/responses/OpenAINotFound"
        "413":
          $ref: "#/components/responses/OpenAIPayloadTooLarge"
        "429":
          $ref: "#/components/responses/OpenAIRateLimited"
        "502":
          $ref: "#/components/responses/OpenAIBadGateway"
        "503":
          $ref: "#/components/responses/OpenAIUnavailable"

  /v1/responses:
    post:
      tags: [downstream]
      summary: Responses 代理
      operationId: createResponse
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResponsesRequest"
      responses:
        "200":
          description: OpenAI JSON 或 SSE 响应；核心只改写 model，其他字段透传
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestId"
            x-token-ne-attempts:
              $ref: "#/components/headers/Attempts"
            x-token-ne-upstream:
              $ref: "#/components/headers/UpstreamName"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponsesResponse"
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/OpenAIBadRequest"
        "401":
          $ref: "#/components/responses/OpenAIUnauthorized"
        "403":
          $ref: "#/components/responses/OpenAIPermissionDenied"
        "404":
          $ref: "#/components/responses/OpenAINotFound"
        "413":
          $ref: "#/components/responses/OpenAIPayloadTooLarge"
        "429":
          $ref: "#/components/responses/OpenAIRateLimited"
        "502":
          $ref: "#/components/responses/OpenAIBadGateway"
        "503":
          $ref: "#/components/responses/OpenAIUnavailable"

  /v1/embeddings:
    post:
      tags: [downstream]
      summary: Embeddings 代理
      operationId: createEmbedding
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmbeddingsRequest"
      responses:
        "200":
          description: OpenAI embeddings JSON
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestId"
            x-token-ne-attempts:
              $ref: "#/components/headers/Attempts"
            x-token-ne-upstream:
              $ref: "#/components/headers/UpstreamName"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbeddingsResponse"
        "400":
          $ref: "#/components/responses/OpenAIBadRequest"
        "401":
          $ref: "#/components/responses/OpenAIUnauthorized"
        "403":
          $ref: "#/components/responses/OpenAIPermissionDenied"
        "404":
          $ref: "#/components/responses/OpenAINotFound"
        "413":
          $ref: "#/components/responses/OpenAIPayloadTooLarge"
        "429":
          $ref: "#/components/responses/OpenAIRateLimited"
        "502":
          $ref: "#/components/responses/OpenAIBadGateway"
        "503":
          $ref: "#/components/responses/OpenAIUnavailable"

components:
  x-phase-two-semantic-validation:
    description: Before configuration publication and core application, validate upstream policy uniqueness by upstream_id, references, Glob syntax, and feature-to-array consistency. Do not silently ignore misspelled routing or policy fields.
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: tn_session
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    ModelId:
      name: model_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
    UpstreamId:
      name: upstream_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RouteId:
      name: route_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SourceId:
      name: source_id
      in: path
      required: true
      schema:
        type: string
        maxLength: 128
    SyncRunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    KeyId:
      name: key_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProxyId:
      name: proxy_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InstanceId:
      name: instance_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeploymentId:
      name: deployment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VersionId:
      name: version_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    From:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date-time

  headers:
    RetryAfter:
      description: 建议下游等待的秒数或 HTTP 日期
      schema:
        type: string
    RequestId:
      description: 核心生成的关联 ID
      schema:
        type: string
    Attempts:
      description: 本次请求的上游尝试次数
      schema:
        type: integer
        minimum: 1
    UpstreamName:
      description: 最终选择的上游名称
      schema:
        type: string

  responses:
    AdminBadRequest:
      description: 请求格式错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminError"
    AdminUnauthorized:
      description: 未登录或会话失效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminError"
    AdminNotFound:
      description: 对象不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminError"
    AdminConflict:
      description: 状态冲突，例如存在引用或部署进行中
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminError"
    AdminValidationFailed:
      description: 字段校验失败
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminError"
    AdminForbidden:
      description: 同源/CSRF 校验失败
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminError"
    AdminPayloadTooLarge:
      description: 请求体超过上限
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminError"
    AdminInternal:
      description: 控制面内部错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminError"
    AdminStorageUnavailable:
      description: PostgreSQL 或依赖不可用
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminError"
    OpenAIUnauthorized:
      description: 下游 API Key 无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpenAIErrorResponse"
    OpenAIPermissionDenied:
      description: Key 无权访问该模型
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpenAIErrorResponse"
    OpenAINotFound:
      description: 模型不存在或不可见
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpenAIErrorResponse"
    OpenAIBadRequest:
      description: 请求无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpenAIErrorResponse"
    OpenAIPayloadTooLarge:
      description: 请求体超过上限
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpenAIErrorResponse"
    OpenAIRateLimited:
      description: 并发或上游限流
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpenAIErrorResponse"
    OpenAIBadGateway:
      description: 上游认证或协议失败
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpenAIErrorResponse"
    OpenAIUnavailable:
      description: 重试耗尽或没有可用上游
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpenAIErrorResponse"

  schemas:
    AdminError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id, details]
          properties:
            code:
              type: string
              example: validation_failed
            message:
              type: string
            request_id:
              type: string
            details:
              type: array
              items:
                type: object
                required: [path, reason]
                properties:
                  path:
                    type: string
                  reason:
                    type: string
    OpenAIErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/OpenAIError"
    OpenAIError:
      type: object
      required: [message, type, param, code]
      properties:
        message:
          type: string
        type:
          type: string
          description: OpenAI 风格错误类型；本地生成值使用固定集合，上游透传值保留原文。
          examples:
            - invalid_request_error
            - authentication_error
            - permission_error
            - not_found_error
            - rate_limit_error
            - server_error
        param:
          type: [string, "null"]
        code:
          type: [string, "null"]
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    AdminUser:
      type: object
      required: [id, username]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
    AuthConfig:
      type: object
      required: [local_login_enabled, oidc_enabled, oidc_login_available]
      properties:
        local_login_enabled:
          type: boolean
        oidc_enabled:
          type: boolean
        oidc_login_available:
          type: boolean
    OIDCBindStart:
      type: object
      required: [authorization_url, expires_at]
      properties:
        authorization_url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
    OIDCBinding:
      type: object
      required: [issuer, subject, bound_at]
      properties:
        issuer:
          type: string
        subject:
          type: string
        bound_at:
          type: string
          format: date-time
    AuthSettings:
      type: object
      required: [revision, oidc_enabled, issuer_url, client_id, scopes, binding, local_login_enabled, session_ttl_hours, client_secret_configured, effective_source]
      properties:
        revision:
          type: integer
          minimum: 0
        oidc_enabled:
          type: boolean
        issuer_url:
          type: [string, "null"]
          format: uri
        client_id:
          type: [string, "null"]
        client_secret_configured:
          type: boolean
        scopes:
          type: array
          minItems: 1
          items:
            type: string
        binding:
          oneOf:
            - $ref: "#/components/schemas/OIDCBinding"
            - type: "null"
        local_login_enabled:
          type: boolean
        session_ttl_hours:
          type: integer
          minimum: 1
          maximum: 2160
        effective_source:
          type: object
          additionalProperties:
            type: string
            enum: [database, environment, default]
        updated_at:
          type: [string, "null"]
          format: date-time
        updated_by:
          type: [string, "null"]
          format: uuid
    AuthSettingsUpdate:
      type: object
      required: [revision, oidc_enabled, issuer_url, client_id, scopes, local_login_enabled, session_ttl_hours]
      properties:
        revision:
          type: integer
          minimum: 0
          description: 0 表示首次创建；非零必须匹配当前 revision。
        oidc_enabled:
          type: boolean
        issuer_url:
          type: [string, "null"]
          format: uri
        client_id:
          type: [string, "null"]
        client_secret:
          type: string
          description: 省略表示保持不变；空字符串表示清除；非空字符串表示替换；null 被拒绝。
        current_password:
          type: string
          format: password
          description: 仅在将 local_login_enabled 从 true 改为 false 时必需；不会持久化或回显。
        scopes:
          type: array
          minItems: 1
          items:
            type: string
        local_login_enabled:
          type: boolean
        session_ttl_hours:
          type: integer
          minimum: 1
          maximum: 2160
    AuthTestRequest:
      type: object
      required: [issuer_url]
      properties:
        issuer_url:
          type: string
          format: uri
        client_id:
          type: [string, "null"]
    OIDCDiscovery:
      type: object
      required: [issuer, authorization_endpoint, token_endpoint, jwks_uri]
      properties:
        issuer:
          type: string
        authorization_endpoint:
          type: string
          format: uri
        token_endpoint:
          type: string
          format: uri
        jwks_uri:
          type: string
          format: uri
        scopes_supported:
          type: array
          items:
            type: string
        code_challenge_methods_supported:
          type: array
          items:
            type: string
    AuthTestResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        discovery:
          $ref: "#/components/schemas/OIDCDiscovery"
        warnings:
          type: array
          items:
            type: string
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
    DataPlaneSettings:
      type: object
      required: [stream_usage_injection]
      properties:
        stream_usage_injection:
          type: boolean
          description: 是否由核心为流式 chat.completions 追加 stream_options.include_usage；默认 true
    RuntimeVersion:
      type: object
      required: [version, commit, built_at]
      properties:
        version:
          type: string
          example: 0.1.0
        commit:
          type: string
          example: 7bf2870
        built_at:
          type: string
          description: RFC3339 构建时间；非发布构建为 unknown
        features:
          type: object
          properties:
            second_phase_model_management:
              type: boolean
              description: 唯一部署阶段开关。为 true 时管理 API 进入第二期严格模式：PUT /api/upstreams/{upstream_id} 必须按 UpstreamUpdateInputPhaseTwo 提交（缺失返回 422、过期返回 409），模型响应返回 billing_state。为 false 或缺失时接受第一期载荷并省略 billing_state。默认 false，只在 Web 客户端已发布严格载荷后才允许启用。
    Billing:
      type: object
      required: [input_usd_per_mtok, cached_input_usd_per_mtok, output_usd_per_mtok]
      properties:
        input_usd_per_mtok:
          type: [number, "null"]
          minimum: 0
        cached_input_usd_per_mtok:
          type: [number, "null"]
          minimum: 0
        cache_write_usd_per_mtok:
          type: [number, "null"]
          minimum: 0
          description: 缓存写入按此价格计费；一期或未提供时为 null。
        audio_input_usd_per_mtok:
          type: [number, "null"]
          minimum: 0
        audio_output_usd_per_mtok:
          type: [number, "null"]
          minimum: 0
        reasoning_usd_per_mtok:
          type: [number, "null"]
          minimum: 0
          description: 推理 token 单价；来源未单列时按输出价计费。
        output_usd_per_mtok:
          type: [number, "null"]
          minimum: 0
        tiers:
          type: array
          description: 上下文阶梯；prompt 达到 threshold_tokens 时整份替换基础价，未给出的维度沿用基础价。
          items:
            $ref: "#/components/schemas/PriceTier"
    PriceTier:
      type: object
      required: [threshold_tokens]
      properties:
        threshold_tokens:
          type: integer
          minimum: 1
        input_usd_per_mtok:
          type: [number, "null"]
        cached_input_usd_per_mtok:
          type: [number, "null"]
        cache_write_usd_per_mtok:
          type: [number, "null"]
        audio_input_usd_per_mtok:
          type: [number, "null"]
        audio_output_usd_per_mtok:
          type: [number, "null"]
        reasoning_usd_per_mtok:
          type: [number, "null"]
        output_usd_per_mtok:
          type: [number, "null"]
    ModelAdmin:
      type: object
      required: [model_id, enabled, created_at, updated_at, billing]
      properties:
        model_id:
          type: string
          maxLength: 256
        enabled:
          type: boolean
        shutdown_date:
          type: [string, "null"]
          format: date
        billing:
          $ref: "#/components/schemas/Billing"
        billing_state:
          $ref: "#/components/schemas/PriceRevisionState"
          description: 第二期启用价格修订管理时必须返回的全局默认价格锁定状态和修订信息；第一期响应省略此字段。
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ModelCreate:
      type: object
      required: [model_id, enabled, billing]
      properties:
        model_id:
          type: string
          minLength: 1
          maxLength: 256
        enabled:
          type: boolean
          default: true
        shutdown_date:
          type: [string, "null"]
          format: date
        billing:
          $ref: "#/components/schemas/Billing"
    ModelUpdate:
      type: object
      properties:
        enabled:
          type: boolean
        shutdown_date:
          type: [string, "null"]
          format: date
        billing:
          $ref: "#/components/schemas/Billing"
        billing_locked:
          type: boolean
        confirm_locked:
          type: boolean
          description: 二次确认对已锁定全局价格的手工修改或解锁
    UpstreamCapability:
      type: object
      description: 上游模型绑定；上游按 `upstream_model_id` 原样收到请求，`model_id` 是绑定的系统模型。
      required: [upstream_model_id, model_id, enabled]
      properties:
        upstream_model_id:
          type: string
          minLength: 1
          maxLength: 256
        model_id:
          type: string
          minLength: 1
          maxLength: 256
        enabled:
          type: boolean
    ModelRoute:
      type: object
      required: [id, pattern, match_type, target_model_id, position, enabled, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        pattern:
          type: string
          minLength: 1
          maxLength: 256
          description: exact 为全局 Model ID 或精确别名；glob 使用完整字符串 Glob，只允许 * 与 ? 通配、区分大小写，拒绝方括号、花括号、反斜线和控制字符。pattern 不设唯一性或重叠约束：同作用域内可以重复或重叠，由 position 决定谁生效；pattern 等于系统模型 ID 也不冲突。
        match_type:
          type: string
          enum: [exact, glob]
        target_model_id:
          type: string
          maxLength: 256
        upstream_id:
          type: [string, "null"]
          format: uuid
        position:
          type: integer
          minimum: 0
          description: 作用域内的解析顺序；数值小的先尝试，第一条命中即生效。由重排接口维护，写入接口不接受该字段。
        enabled:
          type: boolean
        description:
          type: [string, "null"]
          maxLength: 1024
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ModelRouteInput:
      type: object
      required: [pattern, match_type, target_model_id, enabled]
      properties:
        pattern:
          type: string
          minLength: 1
          maxLength: 256
          description: exact 为全局 Model ID 或精确别名；glob 使用完整字符串 Glob，只允许 * 与 ? 通配、区分大小写，拒绝方括号、花括号、反斜线和控制字符。pattern 不设唯一性或重叠约束：同作用域内可以重复或重叠，由 position 决定谁生效；pattern 等于系统模型 ID 也不冲突。
        match_type:
          type: string
          enum: [exact, glob]
        target_model_id:
          type: string
          minLength: 1
          maxLength: 256
        upstream_id:
          type: [string, "null"]
          format: uuid
        enabled:
          type: boolean
        description:
          type: [string, "null"]
          maxLength: 1024
      allOf:
        - if: { properties: { match_type: { const: glob } }, required: [match_type] }
          then: { properties: { pattern: { $ref: "#/components/schemas/GlobPattern" } } }
    ModelRouteReorderInput:
      type: object
      required: [route_ids]
      properties:
        upstream_id:
          type: [string, "null"]
          format: uuid
          description: 目标作用域；null 表示全局作用域。
        route_ids:
          type: array
          minItems: 1
          description: 该作用域内全部规则的新顺序，必须与库中集合完全一致且不重复。
          items:
            type: string
            format: uuid
    GlobPattern:
      type: string
      minLength: 1
      maxLength: 256
      pattern: '^[^\[\]{}\\\x00-\x1f\x7f]+$'
      description: 完整字符串 Glob。只允许 * 与 ? 作为通配符，区分大小写；方括号、花括号、反斜线和控制字符非法。
    RoutePreview:
      type: object
      required: [requested_model, resolved_model, matched_rule, rule_kind, candidates]
      properties:
        requested_model:
          type: string
        resolved_model:
          type: [string, "null"]
        matched_rule:
          type: [string, "null"]
          format: uuid
        rule_kind:
          type: [string, "null"]
          enum: [exact, glob, null]
        candidates:
          type: array
          items:
            type: object
            required: [upstream_id, upstream_model_id]
            properties:
              upstream_id:
                type: string
                format: uuid
              upstream_model_id:
                type: string
              allowed:
                type: boolean
              reason:
                type: [string, "null"]
    UpstreamModelCatalogItem:
      type: object
      required: [upstream_id, upstream_model_id, first_seen_at, last_seen_at, current_in_latest_sync, stale, bound_model_id]
      properties:
        upstream_id:
          type: string
          format: uuid
        upstream_model_id:
          type: string
          maxLength: 256
        object:
          type: [string, "null"]
        owned_by:
          type: [string, "null"]
        provider_created:
          type: [integer, "null"]
        first_seen_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        current_in_latest_sync:
          type: boolean
        stale:
          type: boolean
        bound_model_id:
          type: [string, "null"]
          maxLength: 256
    UpstreamModelSyncRun:
      type: object
      required: [id, upstream_id, state, started_at, finished_at, discovered_count, error]
      properties:
        id:
          type: string
          format: uuid
        upstream_id:
          type: string
          format: uuid
        state:
          type: string
          enum: [running, succeeded, failed]
        started_at:
          type: string
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
        discovered_count:
          type: integer
          minimum: 0
        error:
          type: [string, "null"]
    UpstreamModelSyncBatchItem:
      type: object
      required: [upstream_id, state, run_id, reason]
      properties:
        upstream_id:
          type: string
          format: uuid
        state:
          type: string
          enum: [started, skipped]
          description: started 表示已创建 run；skipped 表示该上游已有运行中的同步，未新建 run。
        run_id:
          type: [string, "null"]
          format: uuid
          description: state 为 started 时是新 run ID，skipped 时为 null。
        reason:
          type: [string, "null"]
          description: state 为 skipped 时固定为 catalog_sync_running。
    UpstreamModelFetchInput:
      type: object
      required: [base_url, auth_style]
      properties:
        base_url:
          type: string
          maxLength: 2048
          description: 与保存上游时相同的限制：不带凭据、查询串或片段；非开发模式下必须是 HTTPS 且不能指向私网或 loopback。
        auth_style:
          type: string
          enum: [bearer, api_key]
        api_key:
          type: [string, "null"]
          description: 只用于本次请求；即使上游返回失败也不会被存储或回显。缺省表示上游无需凭据。
    UpstreamModelImportInput:
      type: object
      required: [upstream_model_id, mode, model_id]
      properties:
        upstream_model_id:
          type: string
          minLength: 1
          maxLength: 256
        mode:
          type: string
          enum: [create_model, bind_existing]
        model_id:
          type: string
          minLength: 1
          maxLength: 256
    UpstreamModelPolicy:
      type: object
      required: [upstream_id, default_action, allow_patterns, deny_patterns]
      properties:
        upstream_id:
          type: string
          format: uuid
        default_action:
          type: string
          enum: [allow, deny]
        allow_patterns:
          type: array
          uniqueItems: true
          items:
            type: string
            maxLength: 256
        deny_patterns:
          type: array
          uniqueItems: true
          items:
            type: string
            maxLength: 256
        updated_at:
          type: string
          format: date-time
    UpstreamModelPolicyInput:
      type: object
      required: [default_action, allow_patterns, deny_patterns]
      properties:
        default_action:
          type: string
          enum: [allow, deny]
        allow_patterns:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/GlobPattern"
        deny_patterns:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/GlobPattern"
    PriceRevisionState:
      type: object
      required: [source, source_id, locked, price_revision_id, revision_created_at, updated_at]
      properties:
        source:
          type: string
          enum: [manual, price_source]
        source_id:
          type: [string, "null"]
        locked:
          type: boolean
        price_revision_id:
          type: string
          format: uuid
          description: 创建模型时在同一事务内生成初始修订；第二期迁移为一期既有模型回填一条 scope=global、source=manual、locked=false 的修订。模型的全局默认价格始终有当前修订，因此该字段不会为空。
        revision_created_at:
          type: string
          format: date-time
          description: Immutable creation time of the referenced price revision.
        updated_at:
          type: string
          format: date-time
    PriceProfile:
      allOf:
        - $ref: "#/components/schemas/Billing"
        - $ref: "#/components/schemas/PriceRevisionState"
        - type: object
          required: [model_id, upstream_id]
          properties:
            model_id:
              type: string
              minLength: 1
              maxLength: 256
            upstream_id:
              type: string
              format: uuid
    PriceProfileInput:
      allOf:
        - $ref: "#/components/schemas/Billing"
        - type: object
          required: [locked]
          properties:
            locked:
              type: boolean
            confirm_locked:
              type: boolean
              description: 二次确认对已锁定的上游价格的手工修改或解锁
    PriceSource:
      type: object
      required: [id, name, enabled]
      properties:
        id:
          type: string
          maxLength: 128
        name:
          type: string
          maxLength: 128
        enabled:
          type: boolean
        last_synced_at:
          type: [string, "null"]
          format: date-time
    PriceSyncRun:
      type: object
      required: [id, source_id, state, items, price_revision_ids, applied_quote_ids]
      properties:
        id:
          type: string
          format: uuid
        source_id:
          type: string
          maxLength: 128
        state:
          type: string
          enum: [running, ready, applied, failed]
          description: running 为正在获取；ready 为报价可审核并应用；applied 表示已至少成功应用一次，仍可继续应用剩余报价；failed 为获取失败。applied_at 为最近一次成功应用时间。
        fetched_at:
          type: [string, "null"]
          format: date-time
        applied_at:
          type: [string, "null"]
          format: date-time
        price_revision_ids:
          type: array
          items:
            type: string
            format: uuid
        applied_quote_ids:
          type: array
          description: 本批次已成功应用的报价 ID；刷新页面后这些行保持不可选。
          items:
            type: string
        error:
          type: [string, "null"]
        items:
          type: array
          items:
            $ref: "#/components/schemas/PriceQuote"
    PriceQuote:
      type: object
      required: [id, model_id, upstream_id, source_model_id, match_method, status, locked, base_price_revision_id, base_updated_at, current, proposed]
      properties:
        id:
          type: string
        model_id:
          type: string
          maxLength: 256
        upstream_id:
          type: [string, "null"]
          format: uuid
        source_model_id:
          type: [string, "null"]
          maxLength: 256
        match_method:
          type: string
          enum: [explicit, upstream_exact, model_exact, normalized, none]
        status:
          type: string
          enum: [safe, needs_review, conflict, missing, ignored]
        locked:
          type: boolean
        base_price_revision_id:
          type: [string, "null"]
          format: uuid
          description: 报价生成时目标价格档案的当前修订。null 表示生成时目标覆盖尚不存在，应用前目标必须仍然不存在；目标已被创建即视为已变化。非 null 时，应用前目标的当前修订必须与之一致，否则拒绝。
        base_updated_at:
          type: [string, "null"]
          format: date-time
        current:
          anyOf:
            - $ref: "#/components/schemas/Billing"
            - type: "null"
        proposed:
          anyOf:
            - $ref: "#/components/schemas/Billing"
            - type: "null"
    PriceApplyInput:
      type: object
      required: [quote_ids]
      properties:
        quote_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        force_locked:
          type: boolean
          default: false
        reviewed_quote_ids:
          type: array
          uniqueItems: true
          items:
            type: string
      description: 控制面要求每个被选中的非安全报价都出现在 `reviewed_quote_ids` 中，且该列表必须是 `quote_ids` 的子集；任一目标的当前修订与报价基线不一致就整批拒绝。`force_locked` 只单独确认锁定档案，不代替逐项审核。应用事务先锁定批次行和全部目标行，成功后追加本批 `price_revision_ids`、更新 `applied_at`，不覆盖之前的批次结果；拒绝时批次保持 `ready`。
    PriceSourceCatalog:
      type: object
      required: [source_id, fetched_at, vendors, data]
      properties:
        source_id:
          type: string
        fetched_at:
          type: string
          format: date-time
        vendors:
          type: array
          items:
            type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/SourceModel"
    SourceModel:
      type: object
      required: [source_model_id, vendor, released_at, deprecated_at, billing, model_id, installed, synced]
      properties:
        source_model_id:
          type: string
          maxLength: 256
        vendor:
          type: string
        released_at:
          type: [string, "null"]
          format: date-time
        deprecated_at:
          type: [string, "null"]
          format: date-time
        billing:
          $ref: "#/components/schemas/Billing"
        model_id:
          type: string
          description: 加入全局模型时使用的目标 ID（显式映射优先，否则为来源 ID）。
        installed:
          type: boolean
          description: 目标 ID 是否已存在于全局模型。
        synced:
          type: boolean
          description: 该来源行是否记录了“保持为全局模型”的同步标记；目录开关显示为开还要求目标模型存在。
        web_search_usd_per_call:
          type: [number, "null"]
          minimum: 0
          description: 按次搜索费用；仅展示，不进入 token 计费
        cache_write_1h_usd_per_mtok:
          type: [number, "null"]
          minimum: 0
          description: 1 小时缓存写入单价
    PriceSourceUnsync:
      type: object
      required: [source_id, cleared]
      properties:
        source_id:
          type: string
        cleared:
          type: integer
          minimum: 0
    PriceSourceInstallInput:
      type: object
      required: [source_model_ids]
      properties:
        source_model_ids:
          type: array
          description: 保持输入顺序去重后处理；重复的 ID 会被忽略。
          minItems: 1
          maxItems: 200
          items:
            type: string
            maxLength: 256
    PriceSourceInstall:
      type: object
      required: [source_id, data]
      properties:
        source_id:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/SourceModelInstall"
    SourceModelInstall:
      type: object
      required: [source_model_id, model_id, outcome]
      properties:
        source_model_id:
          type: string
        model_id:
          type: string
        outcome:
          type: string
          enum: [created, exists, conflict]
          description: 只创建缺失的系统模型，已存在的模型原样保留；路由规则占用名称不再导致失败。`conflict` 只表示该 `source_model_id` 不在当前内嵌数据集里，该行被跳过且不影响其他行。
        reason:
          type: string
    Upstream:
      type: object
      required: [id, name, kind, base_url, auth_style, enabled, models, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 128
        kind:
          type: string
          enum: [api_key]
        base_url:
          type: string
          format: uri
          description: 上游 scheme/host/port 与可选路径前缀；不含隐式 /v1。保存时会规范化尾部 /v1 或 /v1/。
        auth_style:
          type: string
          enum: [bearer, api_key]
        api_key_hint:
          type: [string, "null"]
        enabled:
          type: boolean
        connect_timeout_ms:
          type: integer
          minimum: 100
          maximum: 600000
        first_byte_timeout_ms:
          type: integer
          minimum: 100
          maximum: 3600000
        idle_timeout_ms:
          type: integer
          minimum: 100
          maximum: 3600000
        egress_proxy_id:
          type: [string, "null"]
          format: uuid
          description: 绑定的出站代理档案；空表示直连。第二期字段，一期响应省略或为 null。
        capabilities_revision:
          type: integer
          minimum: 1
          description: 第二期启用目录绑定时必须返回的能力集合版本；第一期响应省略此字段。
        models:
          type: array
          items:
            $ref: "#/components/schemas/UpstreamCapability"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UpstreamInput:
      type: object
      required: [name, kind, base_url, auth_style, enabled, models]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        kind:
          type: string
          enum: [api_key]
        base_url:
          type: string
          format: uri
          description: 上游 scheme/host/port 与可选路径前缀；不含隐式 /v1。创建或更新时会规范化尾部 /v1 或 /v1/。
        auth_style:
          type: string
          enum: [bearer, api_key]
        api_key:
          type: [string, "null"]
          description: 创建时必填；更新时为空表示保留原 Key
        enabled:
          type: boolean
        connect_timeout_ms:
          type: integer
          minimum: 100
          maximum: 600000
        first_byte_timeout_ms:
          type: integer
          minimum: 100
          maximum: 3600000
        idle_timeout_ms:
          type: integer
          minimum: 100
          maximum: 3600000
        egress_proxy_id:
          type: [string, "null"]
          format: uuid
          description: 绑定的出站代理档案；null 或省略表示直连。第二期服务校验引用存在性与核心能力。
        models:
          type: array
          items:
            $ref: "#/components/schemas/UpstreamCapability"
    UpstreamUpdateInput:
      description: 两期共用接口接受两种载荷；二期服务必须按 UpstreamUpdateInputPhaseTwo 校验，不能回退到一期分支。阶段由部署能力决定，不由请求是否携带 revision 决定。
      anyOf:
        - $ref: "#/components/schemas/UpstreamUpdateInputPhaseOne"
        - $ref: "#/components/schemas/UpstreamUpdateInputPhaseTwo"
    UpstreamUpdateInputPhaseOne:
      allOf:
        - $ref: "#/components/schemas/UpstreamInput"
        - type: object
          not:
            required: [capabilities_revision]
            properties:
              capabilities_revision: {}
    UpstreamUpdateInputPhaseTwo:
      allOf:
        - $ref: "#/components/schemas/UpstreamInput"
        - type: object
          required: [capabilities_revision]
          properties:
            capabilities_revision:
              type: integer
              minimum: 1
              description: 当前读取的能力集合版本；缺失返回 422，过期返回 409。
    UpstreamCreateInput:
      allOf:
        - $ref: "#/components/schemas/UpstreamInput"
        - type: object
          required: [api_key]
          properties:
            api_key:
              type: string
              minLength: 1
    UpstreamTestResult:
      type: object
      required: [ok, status, duration_ms]
      properties:
        ok:
          type: boolean
        status:
          type: [integer, "null"]
        duration_ms:
          type: integer
          minimum: 0
        error:
          type: [string, "null"]
    EgressProxy:
      type: object
      required: [id, name, protocol, server, port, enabled, effective_enabled, runtime_state, inbound_port, has_credentials, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 128
        protocol:
          type: string
          enum: [http, socks5, shadowsocks, vmess, vless, trojan]
        server:
          type: string
          minLength: 1
          maxLength: 255
        port:
          type: integer
          minimum: 1
          maximum: 65535
        transport:
          type: object
          additionalProperties: true
          description: 非秘密传输选项；JSON 不枚举协议专属字段，控制面按 `protocol` 做封闭语义校验，未知传输或未知字段返回 422。
        tls:
          type: object
          additionalProperties: true
          description: 非秘密 TLS 选项；JSON 不枚举协议专属字段，控制面按 `protocol` 做封闭语义校验，未知模式或未知字段返回 422。
        has_credentials:
          type: boolean
          description: 是否已保存凭据；凭据本身只写不读，响应不返回明文或密文。
        enabled:
          type: boolean
          description: 管理员期望的启用状态。
        effective_enabled:
          type: boolean
          description: 控制面计算后的有效路由资格；管理员 enabled 为 true 且运行态为 ready，或 swapping 且路由指向已存在出站时为 true；pending、degraded 或管理员禁用时为 false。
        runtime_state:
          type: string
          enum: [pending, swapping, ready, degraded, disabled]
        swap_phase:
          type: [string, "null"]
          enum: [staged_added, route_staged, old_removed, stable_added, route_stable, null]
          description: 仅在 runtime_state 为 swapping 时有值。
        inbound_port:
          type: integer
          minimum: 1024
          maximum: 65535
          description: 控制面分配并持久化的内部 SOCKS5 入站端口。
        last_error:
          type: [string, "null"]
          maxLength: 1024
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    EgressProxyInput:
      type: object
      required: [name, protocol, server, port, enabled]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        protocol:
          type: string
          enum: [http, socks5, shadowsocks, vmess, vless, trojan]
        server:
          type: string
          minLength: 1
          maxLength: 255
        port:
          type: integer
          minimum: 1
          maximum: 65535
        transport:
          type: object
          additionalProperties: true
          description: 非秘密传输选项；JSON 不枚举协议专属字段，控制面按 `protocol` 做封闭语义校验，未知传输或未知字段返回 422。
        tls:
          type: object
          additionalProperties: true
          description: 非秘密 TLS 选项；JSON 不枚举协议专属字段，控制面按 `protocol` 做封闭语义校验，未知模式或未知字段返回 422。
        credentials:
          type: [object, "null"]
          additionalProperties: true
          description: 明文凭据只在创建或更新请求出现。省略表示保留现有凭据，null 表示清除，对象表示替换。
        enabled:
          type: boolean
    EgressProxyTestResult:
      type: object
      required: [ok, duration_ms]
      properties:
        ok:
          type: boolean
        status:
          type: [integer, "null"]
          minimum: 100
          maximum: 599
        duration_ms:
          type: integer
          minimum: 0
        error_class:
          type: [string, "null"]
          maxLength: 128
          description: 连接、DNS、TLS 或代理握手错误分类；成功时为 null。
    DownstreamKey:
      type: object
      required: [id, name, key_prefix, enabled, allowed_models, max_inflight, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 128
        key_prefix:
          type: string
        enabled:
          type: boolean
        allowed_models:
          type: array
          items:
            type: string
        max_inflight:
          type: integer
          minimum: 1
          maximum: 10000
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time
    DownstreamKeyCreate:
      type: object
      required: [name, allowed_models]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        allowed_models:
          type: array
          items:
            type: string
        max_inflight:
          type: integer
          minimum: 1
          maximum: 10000
          default: 64
    DownstreamKeyUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        enabled:
          type: boolean
        allowed_models:
          type: array
          items:
            type: string
        max_inflight:
          type: integer
          minimum: 1
          maximum: 10000
    DownstreamKeyCreated:
      allOf:
        - $ref: "#/components/schemas/DownstreamKey"
        - type: object
          required: [plaintext_key]
          properties:
            plaintext_key:
              type: string
              description: 只在创建或轮换响应中出现一次
    CoreVersion:
      type: object
      required: [id, version, image_ref, protocol_version, config_schema_min, config_schema_max, created_at]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: string
        image_ref:
          type: string
          description: 服务端派生的镜像引用（<repository>:<version> 或 <repository>@<digest>）。
        image_digest:
          type: [string, "null"]
          description: 最近一次拉取解析到的仓库 digest。
        digest_pinned:
          type: boolean
          description: 登记版本时是否显式给了 digest；true 时部署固定使用该 digest，false 时 tag 部署会重新拉取。
        protocol_version:
          type: integer
        config_schema_min:
          type: integer
        config_schema_max:
          type: integer
        build_commit:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
    CoreVersionInput:
      type: object
      required: [version, protocol_version, config_schema_min, config_schema_max]
      properties:
        version:
          type: string
          description: 版本号同时作为镜像 tag；服务端据此派生镜像引用。
        image_digest:
          type: [string, "null"]
          description: 可选；提供时改用 <repository>@<digest>，由服务端校验 sha256 格式。
        protocol_version:
          type: integer
        config_schema_min:
          type: integer
        config_schema_max:
          type: integer
    CoreSpoolState:
      type: object
      required: [instance_id, bytes, unacked_events, dropped_total]
      properties:
        instance_id:
          type: string
          format: uuid
        bytes:
          type: integer
          minimum: 0
        unacked_events:
          type: integer
          minimum: 0
        oldest_unacked_at:
          type: [string, "null"]
          format: date-time
        last_ack_seq:
          type: integer
          minimum: 0
        dropped_total:
          type: integer
          minimum: 0
    CoreInstance:
      type: object
      required: [id, version, container_name, address, weight, state, inflight]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: string
        container_name:
          type: string
        address:
          type: string
        weight:
          type: integer
        state:
          type: string
        inflight:
          type: integer
        config_revision_desired:
          type: [integer, "null"]
        config_revision_applied:
          type: [integer, "null"]
        last_controlled_at:
          type: [string, "null"]
          format: date-time
        last_heartbeat_at:
          type: [string, "null"]
          format: date-time
        spool:
          $ref: "#/components/schemas/CoreSpoolState"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CoreDeployment:
      type: object
      required: [id, state, target_weights, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        from_version:
          type: [string, "null"]
        to_version:
          type: string
        state:
          type: string
        target_weights:
          type: object
          additionalProperties:
            type: integer
        next_weights:
          type: object
          description: Weights the next shift will apply; present while ready or shifting.
          additionalProperties:
            type: integer
        auto_advance:
          type: boolean
          description: 实例就绪后是否自动进入首阶段权重；false 时保持 ready 等待手动切换。
        error:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CoresState:
      type: object
      required: [versions, instances, deployments]
      properties:
        versions:
          type: array
          items:
            $ref: "#/components/schemas/CoreVersion"
        instances:
          type: array
          items:
            $ref: "#/components/schemas/CoreInstance"
        deployments:
          type: array
          items:
            $ref: "#/components/schemas/CoreDeployment"
    CoreDeployInput:
      type: object
      required: [to_version, replicas, initial_weight]
      properties:
        to_version:
          type: string
        replicas:
          type: integer
          minimum: 1
          maximum: 10
        initial_weight:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
        auto_advance:
          type: boolean
          default: true
          description: 新实例就绪并驻留最短阶段时长后自动推进到首阶段权重。
    CoreShiftInput:
      type: object
      required: [weights]
      properties:
        weights:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
            maximum: 10000
    DrainInput:
      type: object
      properties:
        force:
          type: boolean
          default: false
        reason:
          type: [string, "null"]
    PruneInput:
      type: object
      required: [instance_ids]
      properties:
        instance_ids:
          type: array
          items:
            type: string
            format: uuid
        force:
          type: boolean
          default: false
          description: 第二期可选。只删除已停止实例的容器并保留状态目录；缺少排水后的清零证明时，默认 prune 返回 409 spool_not_drained。
    Overview:
      type: object
      properties:
        requests:
          type: integer
        success_rate:
          type: number
        total_tokens:
          type: integer
        cost_usd:
          type: [number, "null"]
        p95_latency_ms:
          type: integer
        p95_ttft_ms:
          type: [integer, "null"]
    UsageTimeseries:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              bucket:
                type: string
                format: date-time
              requests:
                type: integer
              total_tokens:
                type: integer
              cost_usd:
                type: [number, "null"]
    UsageBreakdown:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              requests:
                type: integer
              total_tokens:
                type: integer
              cost_usd:
                type: [number, "null"]
    RequestSummary:
      type: object
      required: [event_id, request_id, occurred_at, endpoint, outcome, attempt_count]
      properties:
        event_id:
          type: string
          format: uuid
        request_id:
          type: string
        occurred_at:
          type: string
          format: date-time
        endpoint:
          type: string
        requested_model:
          type: [string, "null"]
        resolved_model:
          type: [string, "null"]
        upstream_model:
          type: [string, "null"]
        price_revision_id:
          type: [string, "null"]
          format: uuid
        upstream_id:
          type: [string, "null"]
          format: uuid
        egress_mode:
          type: [string, "null"]
          enum: [direct, proxy, null]
          description: 产生终态的那一次尝试的出站方式；第一期事件与未发起上游尝试的本地错误事件为 null。
        egress_proxy_id:
          type: [string, "null"]
          format: uuid
          description: 代理出站时的档案 ID；历史归因，不要求档案当前仍存在。
        stream:
          type: boolean
        http_status:
          type: [integer, "null"]
        outcome:
          type: string
          enum: [success, upstream_error, local_error, client_disconnected, aborted]
        attempt_count:
          type: integer
        ttft_ms:
          type: [integer, "null"]
        duration_ms:
          type: integer
    RequestList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/RequestSummary"
        next_cursor:
          type: [string, "null"]
    RequestDetail:
      allOf:
        - $ref: "#/components/schemas/RequestSummary"
        - type: object
          properties:
            error_class:
              type: [string, "null"]
            error_code:
              type: [string, "null"]
            error_message:
              type: [string, "null"]
            input_tokens:
              type: [integer, "null"]
            cached_input_tokens:
              type: [integer, "null"]
            cache_write_tokens:
              type: [integer, "null"]
            audio_input_tokens:
              type: [integer, "null"]
            audio_output_tokens:
              type: [integer, "null"]
            output_tokens:
              type: [integer, "null"]
            reasoning_tokens:
              type: [integer, "null"]
            total_tokens:
              type: [integer, "null"]
            cost_usd:
              type: [number, "null"]
            upstream_ttfb_ms:
              type: [integer, "null"]
            upstream_duration_ms:
              type: [integer, "null"]
            request_bytes:
              type: [integer, "null"]
            response_bytes:
              type: [integer, "null"]
            status_rewritten_from:
              type: [integer, "null"]
            price_source:
              type: [string, "null"]
            price_source_id:
              type: [string, "null"]
    AuditEvent:
      type: object
      required: [id, actor, action, target_type, created_at]
      properties:
        id:
          type: string
          format: uuid
        actor:
          type: string
        action:
          type: string
        target_type:
          type: string
        target_id:
          type: [string, "null"]
        payload:
          type: object
          additionalProperties: true
        client_ip:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
    AuditList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        next_cursor:
          type: [string, "null"]
    OpenAIModel:
      type: object
      required: [id, object, created, owned_by]
      properties:
        id:
          type: string
        object:
          type: string
          const: model
        created:
          type: integer
          format: unixtime
        owned_by:
          type: string
        shutdown_date:
          type: [string, "null"]
          format: date
    OpenAIModelList:
      type: object
      required: [object, data]
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/OpenAIModel"
    ChatCompletionRequest:
      type: object
      required: [model]
      properties:
        model:
          type: string
        stream:
          type: boolean
        stream_options:
          type: object
          additionalProperties: true
        messages:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true
    ChatCompletionResponse:
      type: object
      additionalProperties: true
    ResponsesRequest:
      type: object
      required: [model]
      properties:
        model:
          type: string
        stream:
          type: boolean
      additionalProperties: true
    ResponsesResponse:
      type: object
      additionalProperties: true
    EmbeddingsRequest:
      type: object
      required: [model, input]
      properties:
        model:
          type: string
        input:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
      additionalProperties: true
    EmbeddingsResponse:
      type: object
      additionalProperties: true
