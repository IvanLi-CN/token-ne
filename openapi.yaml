components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: tn_session
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    ModelId:
      name: model_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
    UpstreamId:
      name: upstream_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    KeyId:
      name: key_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InstanceId:
      name: instance_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeploymentId:
      name: deployment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VersionId:
      name: version_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    From:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date-time

  headers:
    RetryAfter:
      description: 建议下游等待的秒数或 HTTP 日期
      schema:
        type: string
    RequestId:
      description: 核心生成的关联 ID
      schema:
        type: string
    Attempts:
      description: 本次请求的上游尝试次数
      schema:
        type: integer
        minimum: 1
    UpstreamName:
      description: 最终选择的上游名称
      schema:
        type: string

  responses:
    AdminBadRequest:
      description: 请求格式错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminError"
    AdminUnauthorized:
      description: 未登录或会话失效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminError"
    AdminNotFound:
      description: 对象不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminError"
    AdminConflict:
      description: 状态冲突，例如存在引用或部署进行中
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminError"
    AdminValidationFailed:
      description: 字段校验失败
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminError"
    AdminForbidden:
      description: 同源/CSRF 校验失败
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminError"
    AdminPayloadTooLarge:
      description: 请求体超过上限
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminError"
    AdminInternal:
      description: 控制面内部错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminError"
    AdminStorageUnavailable:
      description: PostgreSQL 或依赖不可用
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminError"
    OpenAIUnauthorized:
      description: 下游 API Key 无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpenAIErrorResponse"
    OpenAIPermissionDenied:
      description: Key 无权访问该模型
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpenAIErrorResponse"
    OpenAINotFound:
      description: 模型不存在或不可见
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpenAIErrorResponse"
    OpenAIBadRequest:
      description: 请求无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpenAIErrorResponse"
    OpenAIPayloadTooLarge:
      description: 请求体超过上限
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpenAIErrorResponse"
    OpenAIRateLimited:
      description: 并发或上游限流
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpenAIErrorResponse"
    OpenAIBadGateway:
      description: 上游认证或协议失败
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpenAIErrorResponse"
    OpenAIUnavailable:
      description: 重试耗尽或没有可用上游
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpenAIErrorResponse"

  schemas:
    AdminError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id, details]
          properties:
            code:
              type: string
              example: validation_failed
            message:
              type: string
            request_id:
              type: string
            details:
              type: array
              items:
                type: object
                required: [path, reason]
                properties:
                  path:
                    type: string
                  reason:
                    type: string
    OpenAIErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/OpenAIError"
    OpenAIError:
      type: object
      required: [message, type, param, code]
      properties:
        message:
          type: string
        type:
          type: string
          description: OpenAI 风格错误类型；本地生成值使用固定集合，上游透传值保留原文。
          examples:
            - invalid_request_error
            - authentication_error
            - permission_error
            - not_found_error
            - rate_limit_error
            - server_error
        param:
          type: [string, "null"]
        code:
          type: [string, "null"]
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    AdminUser:
      type: object
      required: [id, username]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
    AuthConfig:
      type: object
      required: [local_login_enabled, oidc_enabled, oidc_login_available]
      properties:
        local_login_enabled:
          type: boolean
        oidc_enabled:
          type: boolean
        oidc_login_available:
          type: boolean
    OIDCBindStart:
      type: object
      required: [authorization_url, expires_at]
      properties:
        authorization_url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
    OIDCBinding:
      type: object
      required: [issuer, subject, bound_at]
      properties:
        issuer:
          type: string
        subject:
          type: string
        bound_at:
          type: string
          format: date-time
    AuthSettings:
      type: object
      required: [revision, oidc_enabled, issuer_url, client_id, scopes, binding, local_login_enabled, session_ttl_hours, client_secret_configured, effective_source]
      properties:
        revision:
          type: integer
          minimum: 0
        oidc_enabled:
          type: boolean
        issuer_url:
          type: [string, "null"]
          format: uri
        client_id:
          type: [string, "null"]
        client_secret_configured:
          type: boolean
        scopes:
          type: array
          minItems: 1
          items:
            type: string
        binding:
          oneOf:
            - $ref: "#/components/schemas/OIDCBinding"
            - type: "null"
        local_login_enabled:
          type: boolean
        session_ttl_hours:
          type: integer
          minimum: 1
          maximum: 2160
        effective_source:
          type: object
          additionalProperties:
            type: string
            enum: [database, environment, default]
        updated_at:
          type: [string, "null"]
          format: date-time
        updated_by:
          type: [string, "null"]
          format: uuid
    AuthSettingsUpdate:
      type: object
      required: [revision, oidc_enabled, issuer_url, client_id, scopes, local_login_enabled, session_ttl_hours]
      properties:
        revision:
          type: integer
          minimum: 0
          description: 0 表示首次创建；非零必须匹配当前 revision。
        oidc_enabled:
          type: boolean
        issuer_url:
          type: [string, "null"]
          format: uri
        client_id:
          type: [string, "null"]
        client_secret:
          type: string
          description: 省略表示保持不变；空字符串表示清除；非空字符串表示替换；null 被拒绝。
        current_password:
          type: string
          format: password
          description: 仅在将 local_login_enabled 从 true 改为 false 时必需；不会持久化或回显。
        scopes:
          type: array
          minItems: 1
          items:
            type: string
        local_login_enabled:
          type: boolean
        session_ttl_hours:
          type: integer
          minimum: 1
          maximum: 2160
    AuthTestRequest:
      type: object
      required: [issuer_url]
      properties:
        issuer_url:
          type: string
          format: uri
        client_id:
          type: [string, "null"]
    OIDCDiscovery:
      type: object
      required: [issuer, authorization_endpoint, token_endpoint, jwks_uri]
      properties:
        issuer:
          type: string
        authorization_endpoint:
          type: string
          format: uri
        token_endpoint:
          type: string
          format: uri
        jwks_uri:
          type: string
          format: uri
        scopes_supported:
          type: array
          items:
            type: string
        code_challenge_methods_supported:
          type: array
          items:
            type: string
    AuthTestResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        discovery:
          $ref: "#/components/schemas/OIDCDiscovery"
        warnings:
          type: array
          items:
            type: string
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
    DataPlaneSettings:
      type: object
      required: [stream_usage_injection]
      properties:
        stream_usage_injection:
          type: boolean
          description: 是否由核心为流式 chat.completions 追加 stream_options.include_usage；默认 true
    RuntimeVersion:
      type: object
      required: [version, commit, built_at]
      properties:
        version:
          type: string
          example: 0.1.0
        commit:
          type: string
          example: 7bf2870
        built_at:
          type: string
          description: RFC3339 构建时间；非发布构建为 unknown
    Billing:
      type: object
      required: [input_usd_per_mtok, cached_input_usd_per_mtok, output_usd_per_mtok]
      properties:
        input_usd_per_mtok:
          type: [number, "null"]
          minimum: 0
        cached_input_usd_per_mtok:
          type: [number, "null"]
          minimum: 0
        output_usd_per_mtok:
          type: [number, "null"]
          minimum: 0
    ModelAdmin:
      type: object
      required: [model_id, enabled, created_at, updated_at, billing]
      properties:
        model_id:
          type: string
          maxLength: 256
        enabled:
          type: boolean
        default_upstream_model:
          type: [string, "null"]
          maxLength: 256
        shutdown_date:
          type: [string, "null"]
          format: date
        billing:
          $ref: "#/components/schemas/Billing"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ModelCreate:
      type: object
      required: [model_id, enabled, billing]
      properties:
        model_id:
          type: string
          minLength: 1
          maxLength: 256
        enabled:
          type: boolean
          default: true
        default_upstream_model:
          type: [string, "null"]
          maxLength: 256
        shutdown_date:
          type: [string, "null"]
          format: date
        billing:
          $ref: "#/components/schemas/Billing"
    ModelUpdate:
      type: object
      properties:
        enabled:
          type: boolean
        default_upstream_model:
          type: [string, "null"]
          maxLength: 256
        shutdown_date:
          type: [string, "null"]
          format: date
        billing:
          $ref: "#/components/schemas/Billing"
    UpstreamCapability:
      type: object
      required: [model_id, enabled, priority, weight]
      properties:
        model_id:
          type: string
        upstream_model_name:
          type: [string, "null"]
          maxLength: 256
        enabled:
          type: boolean
        priority:
          type: integer
          minimum: 0
          maximum: 100000
        weight:
          type: integer
          minimum: 0
          maximum: 10000
    Upstream:
      type: object
      required: [id, name, kind, base_url, auth_style, enabled, models, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 128
        kind:
          type: string
          enum: [api_key]
        base_url:
          type: string
          format: uri
          description: 上游 scheme/host/port 与可选路径前缀；不含隐式 /v1。保存时会规范化尾部 /v1 或 /v1/。
        auth_style:
          type: string
          enum: [bearer, api_key]
        api_key_hint:
          type: [string, "null"]
        enabled:
          type: boolean
        connect_timeout_ms:
          type: integer
          minimum: 100
          maximum: 600000
        first_byte_timeout_ms:
          type: integer
          minimum: 100
          maximum: 3600000
        idle_timeout_ms:
          type: integer
          minimum: 100
          maximum: 3600000
        models:
          type: array
          items:
            $ref: "#/components/schemas/UpstreamCapability"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UpstreamInput:
      type: object
      required: [name, kind, base_url, auth_style, enabled, models]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        kind:
          type: string
          enum: [api_key]
        base_url:
          type: string
          format: uri
          description: 上游 scheme/host/port 与可选路径前缀；不含隐式 /v1。创建或更新时会规范化尾部 /v1 或 /v1/。
        auth_style:
          type: string
          enum: [bearer, api_key]
        api_key:
          type: [string, "null"]
          description: 创建时必填；更新时为空表示保留原 Key
        enabled:
          type: boolean
        connect_timeout_ms:
          type: integer
          minimum: 100
          maximum: 600000
        first_byte_timeout_ms:
          type: integer
          minimum: 100
          maximum: 3600000
        idle_timeout_ms:
          type: integer
          minimum: 100
          maximum: 3600000
        models:
          type: array
          items:
            $ref: "#/components/schemas/UpstreamCapability"
    UpstreamCreateInput:
      allOf:
        - $ref: "#/components/schemas/UpstreamInput"
        - type: object
          required: [api_key]
          properties:
            api_key:
              type: string
              minLength: 1
    UpstreamTestResult:
      type: object
      required: [ok, status, duration_ms]
      properties:
        ok:
          type: boolean
        status:
          type: [integer, "null"]
        duration_ms:
          type: integer
          minimum: 0
        error:
          type: [string, "null"]
    DownstreamKey:
      type: object
      required: [id, name, key_prefix, enabled, allowed_models, max_inflight, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 128
        key_prefix:
          type: string
        enabled:
          type: boolean
        allowed_models:
          type: array
          items:
            type: string
        max_inflight:
          type: integer
          minimum: 1
          maximum: 10000
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time
    DownstreamKeyCreate:
      type: object
      required: [name, allowed_models]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        allowed_models:
          type: array
          items:
            type: string
        max_inflight:
          type: integer
          minimum: 1
          maximum: 10000
          default: 64
    DownstreamKeyUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        enabled:
          type: boolean
        allowed_models:
          type: array
          items:
            type: string
        max_inflight:
          type: integer
          minimum: 1
          maximum: 10000
    DownstreamKeyCreated:
      allOf:
        - $ref: "#/components/schemas/DownstreamKey"
        - type: object
          required: [plaintext_key]
          properties:
            plaintext_key:
              type: string
              description: 只在创建或轮换响应中出现一次
    CoreVersion:
      type: object
      required: [id, version, image_ref, protocol_version, config_schema_min, config_schema_max, created_at]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: string
        image_ref:
          type: string
          description: 服务端派生的镜像引用（<repository>:<version> 或 <repository>@<digest>）。
        image_digest:
          type: [string, "null"]
          description: 最近一次拉取解析到的仓库 digest。
        digest_pinned:
          type: boolean
          description: 登记版本时是否显式给了 digest；true 时部署固定使用该 digest，false 时 tag 部署会重新拉取。
        protocol_version:
          type: integer
        config_schema_min:
          type: integer
        config_schema_max:
          type: integer
        build_commit:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
    CoreVersionInput:
      type: object
      required: [version, protocol_version, config_schema_min, config_schema_max]
      properties:
        version:
          type: string
          description: 版本号同时作为镜像 tag；服务端据此派生镜像引用。
        image_digest:
          type: [string, "null"]
          description: 可选；提供时改用 <repository>@<digest>，由服务端校验 sha256 格式。
        protocol_version:
          type: integer
        config_schema_min:
          type: integer
        config_schema_max:
          type: integer
    CoreSpoolState:
      type: object
      required: [instance_id, bytes, unacked_events, dropped_total]
      properties:
        instance_id:
          type: string
          format: uuid
        bytes:
          type: integer
          minimum: 0
        unacked_events:
          type: integer
          minimum: 0
        oldest_unacked_at:
          type: [string, "null"]
          format: date-time
        last_ack_seq:
          type: integer
          minimum: 0
        dropped_total:
          type: integer
          minimum: 0
    CoreInstance:
      type: object
      required: [id, version, container_name, address, weight, state, inflight]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: string
        container_name:
          type: string
        address:
          type: string
        weight:
          type: integer
        state:
          type: string
        inflight:
          type: integer
        config_revision_desired:
          type: [integer, "null"]
        config_revision_applied:
          type: [integer, "null"]
        last_controlled_at:
          type: [string, "null"]
          format: date-time
        last_heartbeat_at:
          type: [string, "null"]
          format: date-time
        spool:
          $ref: "#/components/schemas/CoreSpoolState"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CoreDeployment:
      type: object
      required: [id, state, target_weights, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        from_version:
          type: [string, "null"]
        to_version:
          type: string
        state:
          type: string
        target_weights:
          type: object
          additionalProperties:
            type: integer
        next_weights:
          type: object
          description: Weights the next shift will apply; present while ready or shifting.
          additionalProperties:
            type: integer
        auto_advance:
          type: boolean
          description: 实例就绪后是否自动进入首阶段权重；false 时保持 ready 等待手动切换。
        error:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CoresState:
      type: object
      required: [versions, instances, deployments]
      properties:
        versions:
          type: array
          items:
            $ref: "#/components/schemas/CoreVersion"
        instances:
          type: array
          items:
            $ref: "#/components/schemas/CoreInstance"
        deployments:
          type: array
          items:
            $ref: "#/components/schemas/CoreDeployment"
    CoreDeployInput:
      type: object
      required: [to_version, replicas, initial_weight]
      properties:
        to_version:
          type: string
        replicas:
          type: integer
          minimum: 1
          maximum: 10
        initial_weight:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
        auto_advance:
          type: boolean
          default: true
          description: 新实例就绪并驻留最短阶段时长后自动推进到首阶段权重。
    CoreShiftInput:
      type: object
      required: [weights]
      properties:
        weights:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
            maximum: 10000
    DrainInput:
      type: object
      properties:
        force:
          type: boolean
          default: false
        reason:
          type: [string, "null"]
    PruneInput:
      type: object
      required: [instance_ids]
      properties:
        instance_ids:
          type: array
          items:
            type: string
            format: uuid
    Overview:
      type: object
      properties:
        requests:
          type: integer
        success_rate:
          type: number
        total_tokens:
          type: integer
        cost_usd:
          type: [number, "null"]
        p95_latency_ms:
          type: integer
        p95_ttft_ms:
          type: [integer, "null"]
    UsageTimeseries:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              bucket:
                type: string
                format: date-time
              requests:
                type: integer
              total_tokens:
                type: integer
              cost_usd:
                type: [number, "null"]
    UsageBreakdown:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              requests:
                type: integer
              total_tokens:
                type: integer
              cost_usd:
                type: [number, "null"]
    RequestSummary:
      type: object
      required: [event_id, request_id, occurred_at, endpoint, outcome, attempt_count]
      properties:
        event_id:
          type: string
          format: uuid
        request_id:
          type: string
        occurred_at:
          type: string
          format: date-time
        endpoint:
          type: string
        requested_model:
          type: [string, "null"]
        upstream_model:
          type: [string, "null"]
        upstream_id:
          type: [string, "null"]
          format: uuid
        stream:
          type: boolean
        http_status:
          type: [integer, "null"]
        outcome:
          type: string
          enum: [success, upstream_error, local_error, client_disconnected, aborted]
        attempt_count:
          type: integer
        ttft_ms:
          type: [integer, "null"]
        duration_ms:
          type: integer
    RequestList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/RequestSummary"
        next_cursor:
          type: [string, "null"]
    RequestDetail:
      allOf:
        - $ref: "#/components/schemas/RequestSummary"
        - type: object
          properties:
            error_class:
              type: [string, "null"]
            error_code:
              type: [string, "null"]
            error_message:
              type: [string, "null"]
            input_tokens:
              type: [integer, "null"]
            cached_input_tokens:
              type: [integer, "null"]
            output_tokens:
              type: [integer, "null"]
            reasoning_tokens:
              type: [integer, "null"]
            total_tokens:
              type: [integer, "null"]
            cost_usd:
              type: [number, "null"]
            upstream_ttfb_ms:
              type: [integer, "null"]
            upstream_duration_ms:
              type: [integer, "null"]
            request_bytes:
              type: [integer, "null"]
            response_bytes:
              type: [integer, "null"]
            status_rewritten_from:
              type: [integer, "null"]
    AuditEvent:
      type: object
      required: [id, actor, action, target_type, created_at]
      properties:
        id:
          type: string
          format: uuid
        actor:
          type: string
        action:
          type: string
        target_type:
          type: string
        target_id:
          type: [string, "null"]
        payload:
          type: object
          additionalProperties: true
        client_ip:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
    AuditList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        next_cursor:
          type: [string, "null"]
    OpenAIModel:
      type: object
      required: [id, object, created, owned_by]
      properties:
        id:
          type: string
        object:
          type: string
          const: model
        created:
          type: integer
          format: unixtime
        owned_by:
          type: string
        shutdown_date:
          type: [string, "null"]
          format: date
    OpenAIModelList:
      type: object
      required: [object, data]
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: "#/components/schemas/OpenAIModel"
    ChatCompletionRequest:
      type: object
      required: [model]
      properties:
        model:
          type: string
        stream:
          type: boolean
        stream_options:
          type: object
          additionalProperties: true
        messages:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true
    ChatCompletionResponse:
      type: object
      additionalProperties: true
    ResponsesRequest:
      type: object
      required: [model]
      properties:
        model:
          type: string
        stream:
          type: boolean
      additionalProperties: true
    ResponsesResponse:
      type: object
      additionalProperties: true
    EmbeddingsRequest:
      type: object
      required: [model, input]
      properties:
        model:
          type: string
        input:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
      additionalProperties: true
    EmbeddingsResponse:
      type: object
      additionalProperties: true
