openapi: 3.1.0
info:
  title: token-ne API
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
  description: |
    token-ne 的对外 OpenAI 兼容接口与管理 API 契约。
    下游 `/v1/*` 只承诺第一期定义的 OpenAI 风格端点；管理 API 使用会话 Cookie、
    同源校验和统一错误信封。内部核心控制协议见 `docs/protocol.md`.
servers:
  - url: http://127.0.0.1:8080
    description: 本地或外部 TLS 代理后的入口

tags:
  - name: system
    description: 控制面运行时版本
  - name: auth
    description: 管理员本地/OIDC 登录、退出、会话和身份绑定
  - name: settings
    description: 管理员认证与系统设置
  - name: models
    description: 全局模型、计费和全局映射
  - name: upstreams
    description: 上游、模型能力和测试
  - name: downstream-keys
    description: 下游 API Key 生命周期
  - name: cores
    description: 核心版本、实例、部署、排水和 spool 摘要
  - name: usage
    description: 总览、时间序列、分布和请求事实
  - name: audit
    description: 管理操作审计
  - name: downstream
    description: OpenAI 兼容下游接口

paths:
  /api/auth/login:
    post:
      tags: [auth]
      summary: 管理员登录
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/AdminBadRequest"
        "413":
          $ref: "#/components/responses/AdminPayloadTooLarge"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "500":
          $ref: "#/components/responses/AdminInternal"
        "503":
          $ref: "#/components/responses/AdminStorageUnavailable"

  /api/auth/logout:
    post:
      tags: [auth]
      summary: 退出登录并使所有 token-ne 会话失效
      operationId: logout
      security:
        - cookieAuth: []
      responses:
        "204":
          description: 已退出
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "500":
          $ref: "#/components/responses/AdminInternal"
        "503":
          $ref: "#/components/responses/AdminStorageUnavailable"

  /api/auth/me:
    get:
      tags: [auth]
      summary: 当前管理员
      operationId: getCurrentAdmin
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 当前管理员
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "500":
          $ref: "#/components/responses/AdminInternal"
        "503":
          $ref: "#/components/responses/AdminStorageUnavailable"

  /api/auth/config:
    get:
      tags: [auth]
      summary: 公开的登录能力
      operationId: getAuthConfig
      security: []
      responses:
        "200":
          description: 本地与 OIDC 登录能力
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthConfig"
        "500":
          $ref: "#/components/responses/AdminInternal"
        "503":
          $ref: "#/components/responses/AdminStorageUnavailable"

  /api/auth/oidc/start:
    get:
      tags: [auth]
      summary: 发起 OIDC 登录
      operationId: startOIDCLogin
      security: []
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: 重定向到 OIDC authorization endpoint，或在不可用时重定向到登录页错误状态
          headers:
            Location:
              schema:
                type: string
                format: uri

  /api/auth/oidc/callback:
    get:
      tags: [auth]
      summary: OIDC 登录或绑定回调
      operationId: oidcCallback
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
        - name: error_description
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: 登录成功、绑定成功或通用登录失败重定向
          headers:
            Location:
              schema:
                type: string
                format: uri
        "400":
          $ref: "#/components/responses/AdminBadRequest"

  /api/auth/oidc/bind/start:
    post:
      tags: [auth]
      summary: 发起当前管理员的 OIDC 身份绑定
      operationId: startOIDCBind
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 绑定授权地址
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OIDCBindStart"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "409":
          $ref: "#/components/responses/AdminConflict"
        "500":
          $ref: "#/components/responses/AdminInternal"
        "503":
          $ref: "#/components/responses/AdminStorageUnavailable"

  /api/settings/auth:
    get:
      tags: [settings]
      summary: 读取管理员认证设置
      operationId: getAuthSettings
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 认证设置、来源和绑定状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSettings"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "500":
          $ref: "#/components/responses/AdminInternal"
        "503":
          $ref: "#/components/responses/AdminStorageUnavailable"
    put:
      tags: [settings]
      summary: 原子更新管理员认证设置
      operationId: updateAuthSettings
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthSettingsUpdate"
      responses:
        "200":
          description: 更新后的认证设置
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSettings"
        "400":
          $ref: "#/components/responses/AdminBadRequest"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "409":
          $ref: "#/components/responses/AdminConflict"
        "413":
          $ref: "#/components/responses/AdminPayloadTooLarge"
        "422":
          $ref: "#/components/responses/AdminValidationFailed"
        "500":
          $ref: "#/components/responses/AdminInternal"
        "503":
          $ref: "#/components/responses/AdminStorageUnavailable"

  /api/settings/auth/test:
    post:
      tags: [settings]
      summary: 测试 OIDC discovery
      operationId: testAuthSettings
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthTestRequest"
      responses:
        "200":
          description: discovery 结果；失败时 ok=false
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTestResult"
        "400":
          $ref: "#/components/responses/AdminBadRequest"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "413":
          $ref: "#/components/responses/AdminPayloadTooLarge"
        "422":
          $ref: "#/components/responses/AdminValidationFailed"
        "500":
          $ref: "#/components/responses/AdminInternal"
        "503":
          $ref: "#/components/responses/AdminStorageUnavailable"

  /api/version:
    get:
      tags: [system]
      summary: 控制面运行时版本
      operationId: getRuntimeVersion
      security: []
      responses:
        "200":
          description: 当前 API 镜像的版本与构建信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeVersion"
        "400":
          $ref: "#/components/responses/AdminBadRequest"
        "500":
          $ref: "#/components/responses/AdminInternal"
        "503":
          $ref: "#/components/responses/AdminStorageUnavailable"

  /api/models:
    get:
      tags: [models]
      summary: 列出全局模型
      operationId: listModels
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 模型列表
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ModelAdmin"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "500":
          $ref: "#/components/responses/AdminInternal"
        "503":
          $ref: "#/components/responses/AdminStorageUnavailable"
    post:
      tags: [models]
      summary: 创建全局模型
      operationId: createModel
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelCreate"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelAdmin"
        "400":
          $ref: "#/components/responses/AdminBadRequest"
        "413":
          $ref: "#/components/responses/AdminPayloadTooLarge"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "500":
          $ref: "#/components/responses/AdminInternal"
        "503":
          $ref: "#/components/responses/AdminStorageUnavailable"
        "409":
          $ref: "#/components/responses/AdminConflict"
        "422":
          $ref: "#/components/responses/AdminValidationFailed"

  /api/models/{model_id}:
    parameters:
      - $ref: "#/components/parameters/ModelId"
    get:
      tags: [models]
      summary: 获取全局模型
      operationId: getModel
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 模型
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelAdmin"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "500":
          $ref: "#/components/responses/AdminInternal"
        "503":
          $ref: "#/components/responses/AdminStorageUnavailable"
        "404":
          $ref: "#/components/responses/AdminNotFound"
    put:
      tags: [models]
      summary: 更新全局模型
      operationId: updateModel
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelUpdate"
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelAdmin"
        "400":
          $ref: "#/components/responses/AdminBadRequest"
        "413":
          $ref: "#/components/responses/AdminPayloadTooLarge"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "500":
          $ref: "#/components/responses/AdminInternal"
        "503":
          $ref: "#/components/responses/AdminStorageUnavailable"
        "404":
          $ref: "#/components/responses/AdminNotFound"
        "422":
          $ref: "#/components/responses/AdminValidationFailed"
    delete:
      tags: [models]
      summary: 删除全局模型
      operationId: deleteModel
      security:
        - cookieAuth: []
      responses:
        "204":
          description: 已删除
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "500":
          $ref: "#/components/responses/AdminInternal"
        "503":
          $ref: "#/components/responses/AdminStorageUnavailable"
        "404":
          $ref: "#/components/responses/AdminNotFound"
        "409":
          $ref: "#/components/responses/AdminConflict"

  /api/upstreams:
    get:
      tags: [upstreams]
      summary: 列出上游
      operationId: listUpstreams
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 上游列表
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Upstream"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "500":
          $ref: "#/components/responses/AdminInternal"
        "503":
          $ref: "#/components/responses/AdminStorageUnavailable"
    post:
      tags: [upstreams]
      summary: 创建上游
      operationId: createUpstream
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpstreamCreateInput"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upstream"
        "400":
          $ref: "#/components/responses/AdminBadRequest"
        "413":
          $ref: "#/components/responses/AdminPayloadTooLarge"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "500":
          $ref: "#/components/responses/AdminInternal"
        "503":
          $ref: "#/components/responses/AdminStorageUnavailable"
        "422":
          $ref: "#/components/responses/AdminValidationFailed"

  /api/upstreams/{upstream_id}:
    parameters:
      - $ref: "#/components/parameters/UpstreamId"
    get:
      tags: [upstreams]
      summary: 获取上游及其模型能力
      operationId: getUpstream
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 上游
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upstream"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "500":
          $ref: "#/components/responses/AdminInternal"
        "503":
          $ref: "#/components/responses/AdminStorageUnavailable"
        "404":
          $ref: "#/components/responses/AdminNotFound"
    put:
      tags: [upstreams]
      summary: 更新上游并原子替换模型能力集合
      operationId: updateUpstream
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpstreamInput"
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upstream"
        "400":
          $ref: "#/components/responses/AdminBadRequest"
        "413":
          $ref: "#/components/responses/AdminPayloadTooLarge"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "500":
          $ref: "#/components/responses/AdminInternal"
        "503":
          $ref: "#/components/responses/AdminStorageUnavailable"
        "404":
          $ref: "#/components/responses/AdminNotFound"
        "422":
          $ref: "#/components/responses/AdminValidationFailed"
    delete:
      tags: [upstreams]
      summary: 删除上游并级联删除模型能力
      operationId: deleteUpstream
      security:
        - cookieAuth: []
      responses:
        "204":
          description: 已删除
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "500":
          $ref: "#/components/responses/AdminInternal"
        "503":
          $ref: "#/components/responses/AdminStorageUnavailable"
        "404":
          $ref: "#/components/responses/AdminNotFound"
        "409":
          $ref: "#/components/responses/AdminConflict"

  /api/upstreams/{upstream_id}/test:
    parameters:
      - $ref: "#/components/parameters/UpstreamId"
    post:
      tags: [upstreams]
      summary: 测试上游
      operationId: testUpstream
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 测试结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpstreamTestResult"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "500":
          $ref: "#/components/responses/AdminInternal"
        "503":
          $ref: "#/components/responses/AdminStorageUnavailable"
        "404":
          $ref: "#/components/responses/AdminNotFound"

  /api/downstream-keys:
    get:
      tags: [downstream-keys]
      summary: 列出下游 Key
      operationId: listDownstreamKeys
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Key 列表
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/DownstreamKey"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "500":
          $ref: "#/components/responses/AdminInternal"
        "503":
          $ref: "#/components/responses/AdminStorageUnavailable"
    post:
      tags: [downstream-keys]
      summary: 创建下游 Key
      operationId: createDownstreamKey
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownstreamKeyCreate"
      responses:
        "201":
          description: 已创建；明文 Key 只在此响应出现一次
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownstreamKeyCreated"
        "400":
          $ref: "#/components/responses/AdminBadRequest"
        "413":
          $ref: "#/components/responses/AdminPayloadTooLarge"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "500":
          $ref: "#/components/responses/AdminInternal"
        "503":
          $ref: "#/components/responses/AdminStorageUnavailable"
        "422":
          $ref: "#/components/responses/AdminValidationFailed"

  /api/downstream-keys/{key_id}:
    parameters:
      - $ref: "#/components/parameters/KeyId"
    put:
      tags: [downstream-keys]
      summary: 更新下游 Key 元数据
      operationId: updateDownstreamKey
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownstreamKeyUpdate"
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownstreamKey"
        "400":
          $ref: "#/components/responses/AdminBadRequest"
        "413":
          $ref: "#/components/responses/AdminPayloadTooLarge"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "500":
          $ref: "#/components/responses/AdminInternal"
        "503":
          $ref: "#/components/responses/AdminStorageUnavailable"
        "404":
          $ref: "#/components/responses/AdminNotFound"
        "422":
          $ref: "#/components/responses/AdminValidationFailed"
    delete:
      tags: [downstream-keys]
      summary: 删除下游 Key
      operationId: deleteDownstreamKey
      security:
        - cookieAuth: []
      responses:
        "204":
          description: 已删除
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "500":
          $ref: "#/components/responses/AdminInternal"
        "503":
          $ref: "#/components/responses/AdminStorageUnavailable"
        "404":
          $ref: "#/components/responses/AdminNotFound"

  /api/downstream-keys/{key_id}/rotate:
    parameters:
      - $ref: "#/components/parameters/KeyId"
    post:
      tags: [downstream-keys]
      summary: 轮换下游 Key；旧 Key 仅保留到显式禁用或过期
      operationId: rotateDownstreamKey
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 新明文 Key 只在此响应出现一次
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownstreamKeyCreated"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "500":
          $ref: "#/components/responses/AdminInternal"
        "503":
          $ref: "#/components/responses/AdminStorageUnavailable"
        "404":
          $ref: "#/components/responses/AdminNotFound"

  /api/cores:
    get:
      tags: [cores]
      summary: 核心版本、实例和部署状态
      operationId: listCores
      security:
        - cookieAuth: []
      responses:
        "200":
          description: 核心状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoresState"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "500":
          $ref: "#/components/responses/AdminInternal"
        "503":
          $ref: "#/components/responses/AdminStorageUnavailable"

  /api/cores/versions:
    post:
      tags: [cores]
      summary: 登记核心版本
      description: 控制面按 CORE_IMAGE_REPOSITORY 与版本号派生镜像引用；客户端不再提供 image_ref。
      operationId: registerCoreVersion
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoreVersionInput"
      responses:
        "201":
          description: 已登记
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoreVersion"
        "400":
          $ref: "#/components/responses/AdminBadRequest"
        "413":
          $ref: "#/components/responses/AdminPayloadTooLarge"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "500":
          $ref: "#/components/responses/AdminInternal"
        "503":
          $ref: "#/components/responses/AdminStorageUnavailable"
        "409":
          $ref: "#/components/responses/AdminConflict"
        "422":
